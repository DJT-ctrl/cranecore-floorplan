[build]
  command        = "npm --prefix frontend run build"
  publish        = "frontend/dist"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  path     = "/functions/v1/analyze-floorplan"
  function = "analyze-floorplan"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
